body:
  - attributes:
      description: If any of these required steps are not taken, we may not be able to review your issue. Help us to help you!
      label: Bug Report Checklist
      options:
        - label: I have looked at the latest `main` branch of the repository.
          required: true
        - label: I have [searched for related issues](https://github.com/JoshuaKGoldberg/talks/issues?q=is%3Aissue) and found none that matched my issue.
          required: true
    type: checkboxes
  - attributes:
      description: What did you expect to happen?
      label: Expected
    type: textarea
    validations:
      required: true
  - attributes:
      description: What happened instead?
      label: Actual
    type: textarea
    validations:
      required: true
  - attributes:
      description: Any additional info you'd like to provide.
      label: Additional Info
    type: textarea

description: Report a problem with a talk's info, links, or deck, or with building or presenting one

labels:
  - "type: bug"

name: 🐛 Bug

title: "🐛 Bug: <short description of the bug>"
